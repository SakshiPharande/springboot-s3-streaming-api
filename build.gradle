plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.4'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
    awsSdkV2 = '2.26.25'
    springCloudAwsVersion = '3.0.3'  // Add this line
}

dependencies {
	// Spring
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

 // AWS SDK v2 (keep if you want manual usage alongside Spring Cloud AWS)
    implementation "software.amazon.awssdk:s3:${awsSdkV2}"
    implementation "software.amazon.awssdk:ssm:${awsSdkV2}"
    implementation "software.amazon.awssdk:sts:${awsSdkV2}"

    // Spring Cloud AWS Parameter Store
   // Spring Cloud AWS Parameter Store
    implementation "io.awspring.cloud:spring-cloud-aws-starter-parameter-store:${springCloudAwsVersion}"


	

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
